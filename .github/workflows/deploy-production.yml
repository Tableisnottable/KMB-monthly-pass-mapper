name: Deploy production website
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_run:
    workflows: ['Refresh Hong Kong transport data']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-website
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.CLOUDFLARE_AUTO_DEPLOY == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify route and fare rules
        run: npx vitest run --maxWorkers=2 --minWorkers=1
      - name: Build and verify the browser calculator
        run: |
          npm run cf:build
          node scripts/test-browser-worker.mjs
      - name: Deploy verified site to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Configure the repository Cloudflare deployment secret and account variable first.' >&2
            exit 1
          fi
          npx wrangler deploy --config wrangler.jsonc
